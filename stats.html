<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Musicfy — Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0C0C0E;--surface:#17171B;--line:#26262C;--green:#1ED760;--text:#F4F4F6;--muted:#8A8A94}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    min-height:100vh;padding:30px 20px 60px}
  .wrap{width:100%;max-width:560px;margin:0 auto}
  h1{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
  h1 b{color:var(--green)}
  .msg{margin-top:40px;color:var(--muted);font-size:14px;line-height:1.6}
  /* numeri giganti, non in griglia: sfalsati */
  .big{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .stat{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .stat .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:46px;line-height:1;
    min-width:110px;text-align:right;color:var(--text)}
  .stat.key .n{color:var(--green)}
  .stat .l{font-size:14px;color:var(--muted);padding-bottom:4px}
  .stat .l b{display:block;color:var(--text);font-size:15px;font-weight:700}
  .devs{margin-top:34px}
  .devs .t{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row .id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);flex:0 0 auto}
  .row .av{font-weight:800;font-size:15px;min-width:34px;text-align:right}
  .row .dt{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right;line-height:1.4}
  .row.me{opacity:.6}
  .row.me .tag{font-size:9px;letter-spacing:1px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:2px 5px;margin-left:8px}
  .note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6}
  .refresh{margin-top:26px;background:none;border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:13px;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>Musicfy · <b>stats</b></h1>
  <div id="out"><div class="msg">Carico…</div></div>
</div>
<script>
  var API='https://yetrccfzogrpaktncwtg.supabase.co/functions/v1/stats';
  var k=new URLSearchParams(location.search).get('k')||'';
  var out=document.getElementById('out');

  function fmt(iso){ if(!iso) return '—'; var d=new Date(iso);
    return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }

  function render(s){
    var devs=s.per_device||[];
    var rows=devs.map(function(d,i){
      var me=i===0?' me':'';
      var tag=i===0?'<span class="tag">probabile tuo</span>':'';
      return '<div class="row'+me+'"><span class="id">'+d.device.slice(0,8)+'</span>'+tag+
        '<span class="av">'+d.avvii+'</span>'+
        '<span class="dt">1°: '+fmt(d.primo)+'<br>ult: '+fmt(d.ultimo)+'</span></div>';
    }).join('');
    var passata = devs.length>1
      ? '<div class="note">Più di un telefono ha aperto Musicfy: l\'app è girata ad altri. Il primo in lista (il più vecchio) è quasi sicuramente il tuo.</div>'
      : '<div class="note">Un solo telefono finora. Se compare un secondo telefono, l\'app è stata passata.</div>';
    out.innerHTML =
      '<div class="big">'+
        '<div class="stat"><span class="n">'+s.aperture_pagina+'</span><span class="l"><b>Aperture pagina</b>quante volte è stata aperta la pagina di download</span></div>'+
        '<div class="stat"><span class="n">'+s.download+'</span><span class="l"><b>Download partiti</b>click su Installa</span></div>'+
        '<div class="stat key"><span class="n">'+s.device_app+'</span><span class="l"><b>Telefoni con l\'app</b>device distinti che hanno aperto Musicfy</span></div>'+
        '<div class="stat"><span class="n">'+s.avvii+'</span><span class="l"><b>Avvii totali</b>quante volte l\'app è stata aperta</span></div>'+
      '</div>'+
      (devs.length? '<div class="devs"><div class="t">Per telefono</div>'+rows+'</div>'+passata : passata)+
      '<button class="refresh" onclick="load()">Aggiorna</button>';
  }

  function load(){
    out.innerHTML='<div class="msg">Carico…</div>';
    fetch(API+'?k='+encodeURIComponent(k)).then(function(r){
      if(r.status===401) throw 'key';
      if(!r.ok) throw 'err';
      return r.json();
    }).then(render).catch(function(e){
      out.innerHTML='<div class="msg">'+(e==='key'
        ? 'Chiave mancante o errata. Apri questa pagina con <code>?k=…</code> in fondo all\'indirizzo.'
        : 'Non riesco a leggere le stats. Riprova tra poco.')+'</div>';
    });
  }
  load();
</script>
</body>
</html>
